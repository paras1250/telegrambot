<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Telegram Community</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <div class="glass-card">
            <div class="icon-container">
                <img src="logo.webp" alt="Community Logo" class="telegram-icon">
            </div>
            <h1>Join Our Exclusive Community</h1>
            <p>Get access to premium content, network with top professionals, and stay ahead of the curve. Your unique invite awaits.</p>
            
            <button id="join-btn" class="join-button">
                <span class="btn-text">Join Telegram</span>
                <div class="loader" id="loader"></div>
            </button>
            <p id="error-message" class="error-msg"></p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
